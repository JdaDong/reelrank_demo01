[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reelrank"
version = "0.1.0"
description = "基于 TMDB 的搜索/推荐/广告四层漏斗排序系统 Demo（召回→粗排→精排→重排）"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
